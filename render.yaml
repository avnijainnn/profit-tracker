# Free single-owner production service with external Neon PostgreSQL.
# Single-owner production deployment. No database or mail service is created by this blueprint.
services:
  - type: web
    name: tanvi-profit-studio
    runtime: python
    region: singapore
    plan: free
    autoDeployTrigger: "off"
    buildCommand: bash build.sh
    startCommand: bash start.sh
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: APP_ENV
        value: production
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        sync: false
      # Host and HTTPS CSRF origin come from RENDER_EXTERNAL_HOSTNAME.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL_REQUIRE
        value: "true"
      - key: TRUST_PROXY_HTTPS
        value: "true"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: ENABLE_PASSWORD_RESET
        value: "false"
      - key: INITIAL_OWNER_USERNAME
        value: owner
      - key: INITIAL_OWNER_SETUP_TOKEN
        sync: false
      - key: DEMO_SEED_DATA
        value: "false"
